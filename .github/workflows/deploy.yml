# Build, test and publish the static site to GitHub Pages.
# Nothing here runs Blender: the committed public/models/campus.glb and
# public/data/*.json are used as they are.
#
# One-time setup: Repository Settings -> Pages -> Source: GitHub Actions.
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # budget + unit tests. Browser smoke tests are run locally before release;
      # keeping them out of the Pages gate avoids slow/ flaky WebGL CI runs.
      - run: make check test
      # project site: https://ankit7d67.github.io/iitrpr-campus-3d/
      # the base path must match the repository name; GitHub serves Pages there
      - run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: /iitrpr-campus-3d
          NEXT_PUBLIC_SITE_URL: https://ankit7d67.github.io
      - uses: actions/configure-pages@v5
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
